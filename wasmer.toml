[package]
name = "harolflores/php-harolflores"
version = "1.0.3"
description = "La Caserita - Sistema de Tienda Online y POS"
private = true

[dependencies]
"php/php" = "8.3.*"

[fs]
"/app" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app", "-S", "localhost:8080"]
